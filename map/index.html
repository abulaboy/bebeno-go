<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>這是哪裡啦？！互動地圖｜BEBENO go</title>
<meta name="description" content="《這是哪裡啦？！Where on Earth?!》每一集的落點與報導點，點定位針看影片和地圖連結。">
<link rel="icon" href="../icon-64.png">
<meta property="og:title" content="這是哪裡啦？！互動地圖｜BEBENO go">
<meta property="og:url" content="https://abulaboy.github.io/bebeno-go/map/">
<meta property="og:image" content="https://abulaboy.github.io/bebeno-go/logo.jpg">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
:root{--brown:#3b1d0b;--brown2:#5a2f12;--cream:#fbf1dc;--paper:#fff8e8;--gold:#d9a02b;--saffron:#e8782a;--teal:#1f7a7a;--plum:#6b2d6b;--leaf:#3f8a4a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--brown);background:var(--cream)}
header{display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem;background:var(--brown);color:var(--cream);flex-wrap:wrap}
header h1{margin:0;font-size:1.15rem;line-height:1.3}
header h1 small{display:block;font-size:.75rem;font-weight:400;opacity:.8}
header a{color:var(--cream);font-size:.85rem;margin-left:auto;text-decoration:none;border:1px solid var(--gold);border-radius:999px;padding:.25rem .75rem}
#eps{display:flex;gap:.4rem;padding:.5rem 1rem;overflow-x:auto;background:var(--paper);border-bottom:1px solid var(--gold)}
#eps button{flex:none;font:inherit;font-size:.85rem;border:1px solid var(--brown2);background:var(--cream);color:var(--brown);border-radius:999px;padding:.3rem .8rem;cursor:pointer}
#eps button.on{background:var(--saffron);color:#fff;border-color:var(--saffron)}
#wrap{position:relative;display:flex;height:calc(100% - 100px)}
#map{flex:1;min-width:0;height:100%}
#panel{width:380px;max-width:100%;height:100%;overflow-y:auto;background:var(--paper);border-left:2px solid var(--gold);padding:1rem}
#panel h2{margin:.1rem 0 .3rem;font-size:1.2rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;background:var(--saffron);color:#fff;border-radius:6px;padding:.1rem .45rem;margin-right:.35rem}
.muted{color:var(--brown2);font-size:.85rem;line-height:1.55}
.note{background:#fff3d6;border-left:4px solid var(--gold);padding:.45rem .6rem;font-size:.8rem;border-radius:4px;margin:.6rem 0}
.media{margin:.7rem 0;border-radius:10px;overflow:hidden;background:var(--brown);aspect-ratio:16/9;position:relative}
.media img,.media iframe{width:100%;height:100%;border:0;display:block;object-fit:cover}
.media .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--cream);font-size:.95rem;text-align:center;padding:1rem}
.media button{position:absolute;inset:0;width:100%;border:0;background:transparent;cursor:pointer}
.media button span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);color:#fff;border-radius:12px;padding:.5rem 1rem;font-size:.95rem}
.route{margin-top:.9rem}
.route h3{font-size:.9rem;margin:0 0 .35rem;display:flex;align-items:center;gap:.4rem}
.route h3 i{width:12px;height:12px;border-radius:50%;display:inline-block}
.pt{display:flex;gap:.5rem;align-items:flex-start;padding:.45rem .5rem;border-radius:8px;cursor:pointer;font-size:.88rem;line-height:1.4}
.pt:hover,.pt.on{background:var(--cream)}
.pt b{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:.75rem;display:flex;align-items:center;justify-content:center}
.pt a{font-size:.78rem;color:var(--teal);margin-right:.5rem}
.ep-pin{background:var(--saffron);color:#fff;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.4);width:38px!important;height:38px!important;display:flex;align-items:center;justify-content:center}
.ep-pin span{transform:rotate(45deg);font-weight:800;font-size:.8rem}
.pt-pin{border:2px solid #fff;border-radius:50%;color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.leaflet-popup-content{font-family:inherit;font-size:.85rem}
@media (max-width:760px){
  #wrap{flex-direction:column;height:auto}
  #map{height:55vh;flex:none}
  #panel{width:100%;height:auto;border-left:0;border-top:2px solid var(--gold)}
}
</style>
</head>
<body>
<header>
  <h1>這是哪裡啦？！互動地圖<small>Where on Earth?! — 每集一根定位針，點開看報導點與影片</small></h1>
  <a href="../">← BEBENO go 首頁</a>
</header>
<div id="eps" role="tablist" aria-label="集數"></div>
<div id="wrap">
  <div id="map" aria-label="地圖"></div>
  <aside id="panel"><p class="muted">載入中…</p></aside>
</div>
<script src="leaflet/leaflet.js"></script>
<script>
(function(){
var COLORS=['#1f7a7a','#e8782a','#6b2d6b','#3f8a4a','#b8402a','#2b5fa8'];
var map=L.map('map',{worldCopyJump:true,zoomControl:true}).setView([15,100],3);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
var panel=document.getElementById('panel'),epsBar=document.getElementById('eps');
var epLayer=L.layerGroup().addTo(map),ptLayer=L.layerGroup().addTo(map);
var DATA=[],cur=null,ptMarkers=[];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:''}
function epIcon(e){return L.divIcon({className:'',html:'<div class="ep-pin"><span>'+esc(e.ep.replace('EP.',''))+'</span></div>',iconSize:[38,38],iconAnchor:[6,38]})}
function ptIcon(n,c){return L.divIcon({className:'',html:'<div class="pt-pin" style="width:24px;height:24px;background:'+c+'">'+n+'</div>',iconSize:[24,24],iconAnchor:[12,12]})}
function overview(){
  cur=null;ptLayer.clearLayers();ptMarkers=[];
  [].forEach.call(epsBar.children,function(b){b.classList.toggle('on',b.dataset.id==='all')});
  var h='<h2>全部集數</h2><p class="muted">地圖上每一根橘色定位針是一集的落點。點定位針或上方的集數，就能看到那一集所有報導點、影片和 Google 地圖連結。</p>';
  DATA.forEach(function(e){h+='<div class="pt" data-ep="'+esc(e.id)+'"><b style="background:var(--saffron)">'+esc(e.ep.replace('EP.',''))+'</b><div><strong>'+esc(e.ep)+'　'+esc(e.title)+'</strong><br><span class="muted">'+esc((e.points||[]).length)+' 個報導點</span></div></div>'});
  panel.innerHTML=h;
  if(DATA.length){var b=L.latLngBounds(DATA.map(function(e){return[e.lat,e.lng]}));map.fitBounds(b.pad(0.5),{maxZoom:4})}
  if(location.hash)history.replaceState(null,'',location.pathname);
}
function show(id){
  var e=DATA.filter(function(x){return x.id===id})[0];if(!e){overview();return}
  cur=e;ptLayer.clearLayers();ptMarkers=[];
  [].forEach.call(epsBar.children,function(b){b.classList.toggle('on',b.dataset.id===id)});
  var routes=[],byRoute={};
  (e.points||[]).forEach(function(p){var r=p.route||'報導點';if(!byRoute[r]){byRoute[r]=[];routes.push(r)}byRoute[r].push(p)});
  var h='<h2><span class="tag">'+esc(e.ep)+'</span>'+esc(e.title)+'</h2>';
  if(e.drop)h+='<p class="muted">📍 '+esc(e.drop)+'（'+e.lat+', '+e.lng+'）</p>';
  if(e.summary)h+='<p class="muted">'+esc(e.summary)+'</p>';
  var vid=/^[\w-]{11}$/.test(e.youtubeId||'')?e.youtubeId:'';
  var thumb=safeUrl(e.thumb)||(vid?'https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg':'');
  h+='<div class="media" id="media">'+(thumb?'<img src="'+esc(thumb)+'" alt="'+esc(e.ep+' 縮圖')+'">':'')+(vid?'<button type="button" aria-label="播放影片"><span>▶ 播放影片</span></button>':'<div class="ph">🎬 影片即將上架</div>')+'</div>';
  if(vid)h+='<p class="muted"><a href="https://www.youtube.com/watch?v='+vid+'" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a></p>';
  if(e.coordStatus==='tentative')h+='<div class="note">報導點座標為暫定位置，正在核對中；點「Google 地圖」會開到正確的店家／景點頁。</div>';
  var n=0;
  routes.forEach(function(r,ri){
    var c=COLORS[ri%COLORS.length];
    h+='<div class="route"><h3><i style="background:'+c+'"></i>'+esc(r)+'</h3>';
    byRoute[r].forEach(function(p){
      n++;var idx=ptMarkers.length;
      var m=L.marker([p.lat,p.lng],{icon:ptIcon(n,c),title:p.name}).addTo(ptLayer);
      var links=(safeUrl(p.map)?'<a href="'+esc(p.map)+'" target="_blank" rel="noopener">Google 地圖 ↗</a>':'')+(safeUrl(p.web)?' <a href="'+esc(p.web)+'" target="_blank" rel="noopener">官網 ↗</a>':'');
      m.bindPopup('<strong>'+n+'. '+esc(p.name)+'</strong><br>'+esc(r)+'<br>'+links);
      m.on('click',function(){hl(idx)});
      ptMarkers.push(m);
      h+='<div class="pt" data-i="'+idx+'"><b style="background:'+c+'">'+n+'</b><div>'+esc(p.name)+'<br>'+links+'</div></div>';
    });
    h+='</div>';
  });
  panel.innerHTML=h;panel.scrollTop=0;
  var mb=panel.querySelector('#media button');
  if(mb)mb.addEventListener('click',function(){document.getElementById('media').innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+vid+'?autoplay=1" title="'+esc(e.ep+' '+e.title)+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>'});
  var pts=(e.points||[]).map(function(p){return[p.lat,p.lng]});pts.push([e.lat,e.lng]);
  map.fitBounds(L.latLngBounds(pts).pad(0.15),{maxZoom:16});
  if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
}
function hl(i){
  [].forEach.call(panel.querySelectorAll('.pt[data-i]'),function(el){el.classList.toggle('on',+el.dataset.i===i)});
  var el=panel.querySelector('.pt[data-i="'+i+'"]');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
panel.addEventListener('click',function(ev){
  if(ev.target.closest('a'))return;
  var el=ev.target.closest('.pt');if(!el)return;
  if(el.dataset.ep){show(el.dataset.ep);return}
  var i=+el.dataset.i,m=ptMarkers[i];if(m){map.setView(m.getLatLng(),Math.max(map.getZoom(),15));m.openPopup();hl(i)}
});
epsBar.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;b.dataset.id==='all'?overview():show(b.dataset.id)});
fetch('episodes.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){
  DATA=(d.episodes||[]).filter(function(e){return isFinite(e.lat)&&isFinite(e.lng)});
  var h='<button type="button" data-id="all">全部</button>';
  DATA.forEach(function(e){
    h+='<button type="button" data-id="'+esc(e.id)+'">'+esc(e.ep)+' '+esc(e.title.split('・').pop())+'</button>';
    L.marker([e.lat,e.lng],{icon:epIcon(e),title:e.ep+' '+e.title,zIndexOffset:1000}).addTo(epLayer).on('click',function(){show(e.id)});
  });
  epsBar.innerHTML=h;
  var id=location.hash.slice(1);id&&DATA.some(function(e){return e.id===id})?show(id):overview();
}).catch(function(){panel.innerHTML='<p class="muted">地圖資料載入失敗，請重新整理再試一次。</p>'});
window.addEventListener('hashchange',function(){var id=location.hash.slice(1);if(id&&(!cur||cur.id!==id))show(id)});
})();
</script>
</body>
</html>
